<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SecureSphere AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .subtitle {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .mode {
      display: block;
      padding: 11px;
      margin-bottom: 9px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: white;
      cursor: pointer;
    }

    .mode input {
      margin-right: 8px;
    }

    .mode-title {
      font-weight: 600;
      font-size: 13px;
    }

    .mode-description {
      margin-top: 4px;
      margin-left: 23px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 7px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.92;
    }

    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
    }

    #scanSection {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    #report {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: white;
      border: 1px solid #d1d5db;
    }

    .report-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .risk-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .risk-value {
      font-weight: 700;
    }

    #recommendation {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      line-height: 1.5;
      color: #4b5563;
    }

    #findingsSection {
      margin-top: 10px;
    }

    #findingsTitle {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    #findings {
      margin: 0;
      padding-left: 18px;
      font-size: 11px;
      color: #4b5563;
    }

    #findings li {
      margin-bottom: 4px;
      line-height: 1.35;
    }
  </style>
</head>

<body>

  <h2>SecureSphere AI</h2>

  <div class="subtitle">
    Browser protection and manual security analysis.
  </div>

  <label class="mode">
    <input
      type="radio"
      name="scanMode"
      value="manual"
    >
    <span class="mode-title">Manual Scan</span>

    <div class="mode-description">
      Scan only when you press the scan button.
    </div>
  </label>

  <label class="mode">
    <input
      type="radio"
      name="scanMode"
      value="realtime-persistent"
    >
    <span class="mode-title">Real-time • Persistent</span>

    <div class="mode-description">
      Automatically scan webpages and keep the result visible.
    </div>
  </label>

  <label class="mode">
    <input
      type="radio"
      name="scanMode"
      value="realtime-temporary"
    >
    <span class="mode-title">Real-time • Temporary</span>

    <div class="mode-description">
      Automatically scan webpages and show the result briefly.
    </div>
  </label>

  <button id="saveMode">
    Save Protection Mode
  </button>

  <div id="scanSection">
    <button id="scanButton">
      Scan Current Page
    </button>
  </div>

  <div id="status">
    Loading settings...
  </div>

  <div id="report">
    <div class="report-title">
      Security Report
    </div>

    <div class="risk-row">
      <span>Risk</span>
      <span id="riskLevel" class="risk-value">-</span>
    </div>

    <div class="risk-row">
      <span>Score</span>
      <span id="riskScore" class="risk-value">-</span>
    </div>

    <div class="risk-row">
      <span>Confidence</span>
      <span id="confidence" class="risk-value">-</span>
    </div>

    <div id="recommendation"></div>

    <div id="findingsSection">
      <div id="findingsTitle">
        Findings
      </div>

      <ul id="findings"></ul>
    </div>
  </div>

  <script src="popup.js"></script>

</body>
</html>
