<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SecureSphere AI</title>

  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    h2 {
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .mode {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: white;
      cursor: pointer;
    }

    .mode input {
      margin-right: 8px;
    }

    .mode-title {
      font-weight: 600;
      font-size: 14px;
    }

    .mode-description {
      margin-top: 4px;
      margin-left: 23px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
    }

    #scanSection {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>

<body>

  <h2>SecureSphere AI</h2>

  <div class="subtitle">
    Choose how browser protection should behave.
  </div>

  <label class="mode">
    <input
      type="radio"
      name="scanMode"
      value="manual"
    >
    <span class="mode-title">Manual Scan</span>

    <div class="mode-description">
      Scan only when you open the extension and press the scan button.
    </div>
  </label>

  <label class="mode">
    <input
      type="radio"
      name="scanMode"
      value="realtime-persistent"
    >
    <span class="mode-title">Real-time • Persistent</span>

    <div class="mode-description">
      Automatically scan webpages and keep the security indicator visible.
    </div>
  </label>

  <label class="mode">
    <input
      type="radio"
      name="scanMode"
      value="realtime-temporary"
    >
    <span class="mode-title">Real-time • Temporary</span>

    <div class="mode-description">
      Automatically scan webpages and show the result briefly.
    </div>
  </label>

  <button id="saveMode">
    Save Protection Mode
  </button>

  <div id="scanSection">
    <button id="scanButton">
      Scan Current Page
    </button>
  </div>

  <div id="status">
    Loading settings...
  </div>

  <script src="popup.js"></script>

</body>
</html>
