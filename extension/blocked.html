<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SecureSphere AI - Security Warning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c14;
      color: #e7edf7;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(560px, calc(100vw - 40px));
      padding: 34px;
      border: 1px solid #e1594b;
      border-radius: 18px;
      background: #111c2e;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .risk {
      color: #e1594b;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .message {
      color: #aebbd0;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border-radius: 9px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #leaveButton {
      border: 0;
      background: #e1594b;
      color: white;
    }

    #continueButton {
      border: 1px solid #52627d;
      background: #1a2740;
      color: #e7edf7;
    }

    .footer {
      margin-top: 22px;
      color: #71819d;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">⚠</div>

    <h1>Security Warning</h1>

    <div id="risk" class="risk">
      HIGH RISK
    </div>

    <div id="message" class="message">
      SecureSphere AI detected potentially dangerous activity on this page.
    </div>

    <div class="buttons">
      <button id="leaveButton">
        Leave Page
      </button>

      <button id="continueButton">
        Continue Anyway
      </button>
    </div>

    <div class="footer">
      Protected by SecureSphere AI
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
