
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureSphere AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.19.0/iconfont/tabler-icons.min.css">

<style>

  :root{
    --bg:#0A1220;
    --surface:#111C2E;
    --surface-raised:#16233A;
    --border:#233150;
    --border-strong:#33456B;
    --text:#E7EDF7;
    --text-dim:#8FA1C0;
    --text-faint:#5C6E90;
    --signal:#3FBFA6;
    --signal-dim:#1E4A42;
    --warn:#E8A33D;
    --warn-dim:#4A3A1C;
    --danger:#E1594B;
    --danger-dim:#4A211D;
    --brand:#5B8DEF;

    --font-sans:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    min-height:100vh;
  }

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 60px;
  }

  /* Top bar */

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 0;
    border-bottom:1px solid var(--border);
    margin-bottom:28px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:34px;
    height:34px;
    border-radius:9px;
    background:linear-gradient(160deg,var(--signal),var(--brand));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-mono);
    font-weight:600;
    color:#04140F;
    font-size:15px;
  }

  .brand-name{
    font-weight:600;
    font-size:16px;
    letter-spacing:0.2px;
  }

  .brand-sub{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .tabs{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
  }
.error-message {
  color: var(--danger);
  font-size: 13px;
  margin: 14px 0 0;
  text-align: left;
}
  .tab{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    background:transparent;
    border:1px solid transparent;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
  }

  .tab:hover{
    color:var(--text);
    background:var(--surface-raised);
  }

  .tab.active{
    color:var(--signal);
    background:var(--signal-dim);
    border-color:var(--signal);
  }

  .screen{
    display:none;
    animation:rise .35s ease;
  }

  .screen.active{
    display:block;
  }

  @keyframes rise{
    from{
      opacity:0;
      transform:translateY(6px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  h1{
    font-size:26px;
    font-weight:600;
    margin-bottom:6px;
  }

  h2{
    font-size:15px;
    font-weight:600;
    margin-bottom:14px;
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--signal);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:10px;
  }

  .lede{
    color:var(--text-dim);
    font-size:14px;
    max-width:520px;
    margin-bottom:28px;
    line-height:1.6;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
  }

  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }

  @media(max-width:760px){

    .grid-2{
      grid-template-columns:1fr;
    }

  }

  /* Register screen */

  .login-wrap{
    display:flex;
    justify-content:center;
    padding:60px 0;
  }

  .login-card{
    width:380px;
    text-align:center;
    padding:40px 32px;
  }

  .login-card .brand-mark{
    margin:0 auto 18px;
    width:48px;
    height:48px;
    font-size:20px;
    border-radius:12px;
  }

  .field{
    margin-top:16px;
    text-align:left;
  }

  .field label{
    font-size:12px;
    color:var(--text-dim);
    display:block;
    margin-bottom:6px;
  }

  .field input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    color:var(--text);
    font-family:var(--font-sans);
    font-size:14px;
  }

  .field input:focus{
    outline:none;
    border-color:var(--brand);
  }

  .btn{
    font-family:var(--font-sans);
    font-weight:600;
    font-size:14px;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .15s;
  }

  .btn-primary{
    background:var(--brand);
    color:#06122B;
    width:100%;
    margin-top:22px;
  }

  .btn-primary:hover{
    filter:brightness(1.08);
  }

  .btn-ghost{
    background:transparent;
    border-color:var(--border-strong);
    color:var(--text);
  }

  .btn-ghost:hover{
    border-color:var(--brand);
    color:var(--brand);
  }

</style>
</head>


<body>

<div class="app">

  <!-- Top Bar -->

  <div class="topbar">

    <div class="brand">

      <div class="brand-mark">
        <i class="ti ti-shield-check"></i>
      </div>

      <div>

        <div class="brand-name">
          SecureSphere AI
        </div>

      </div>

    </div>

    <div class="tabs" id="tabs"></div>

  </div>
{% if error_message %}
  <div class="error-message">
    {{ error_message }}
  </div>
{% endif %}

  <!-- Register -->

  <section class="screen" data-screen="login">

    <div class="login-wrap">

      <div class="card login-card">

        <div class="brand-mark">
          <i class="ti ti-shield-check"></i>
        </div>


        <h1 style="font-size:19px;">
          Register
        </h1>


        <p class="lede" style="margin:6px auto 0;font-size:13px;">
          Sign up to check a link, email, app, or QR code before it becomes a problem.
        </p>


        <!-- Registration Form -->

        <form
          action="/perform_registration"
          method="POST"
          id="registerForm"
        >


          <!-- NAME -->

          <div class="field">

            <label for="name">
              Name
            </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              autocomplete="name"
              required
            >

          </div>


          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@psit.ac.in"
              autocomplete="email"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            >

          </div>


          <!-- SUBMIT -->

          <button
            type="submit"
            class="btn btn-primary"
          >
            Sign up
          </button>

        </form>


        <br>
        <br>


        <p>

          Already a member?

          <a href="/">
            <span style="color:white">
              Login Here
            </span>
          </a>

        </p>


      </div>

    </div>

  </section>

</div>


<script>


/* =========================================
   TOP NAVIGATION
   ========================================= */

const screens = [
  'login',
  'submit',
  'analysis',
  'report',
  'correlation',
  'dashboard'
];


const labels = {

  login:'1. Register',

  submit:'2. Submit',

  analysis:'3. Live analysis',

  report:'4. Risk report',

  correlation:'5. Correlation',

  dashboard:'6. Dashboard'

};


const tabsEl =
  document.getElementById('tabs');


screens.forEach(s => {

  const b =
    document.createElement('button');

  b.className = 'tab';

  b.textContent = labels[s];

  b.onclick = () => goTo(s);

  b.id = 'tab-' + s;

  tabsEl.appendChild(b);

});


function goTo(name){

  screens.forEach(s => {

    const screen =
      document.querySelector(
        `[data-screen="${s}"]`
      );

    const tab =
      document.getElementById(
        'tab-' + s
      );

    if(screen){

      screen.classList.toggle(
        'active',
        s === name
      );

    }

    if(tab){

      tab.classList.toggle(
        'active',
        s === name
      );

    }

  });

}


goTo('login');


/* =========================================
   REGISTER FORM VALIDATION
   ========================================= */

const registerForm =
  document.getElementById('registerForm');

const nameInput =
  document.getElementById('name');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('password');


registerForm.addEventListener(
  'submit',
  function(event){

    const name =
      nameInput.value.trim();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    /* ==============================
       NAME VALIDATION
       ============================== */

    if(name === ''){

      event.preventDefault();

      nameInput.setCustomValidity(
        'Please enter your name.'
      );

      nameInput.reportValidity();

      return;

    }


    /*
       Name should contain only
       letters and spaces.
    */

    const namePattern =
      /^[A-Za-z ]+$/;


    if(!namePattern.test(name)){

      event.preventDefault();

      nameInput.setCustomValidity(
        'Name should contain only letters and spaces.'
      );

      nameInput.reportValidity();

      return;

    }


    /* ==============================
       EMAIL VALIDATION
       ============================== */

    if(email === ''){

      event.preventDefault();

      emailInput.setCustomValidity(
        'Please enter your email address.'
      );

      emailInput.reportValidity();

      return;

    }

 

    const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
       

    if(!emailPattern.test(email)){

      event.preventDefault();

      emailInput.setCustomValidity(
        'Please enter a valid email address, for example: student@gmail.com'
      );

      emailInput.reportValidity();

      return;

    }


    /* ==============================
       PASSWORD EMPTY
       ============================== */

    if(password === ''){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Please enter a password.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       PASSWORD LENGTH
       ============================== */

    if(password.length < 8){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Password must contain at least 8 characters.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       PASSWORD UPPERCASE
       ============================== */

    if(!/[A-Z]/.test(password)){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Password must contain at least one uppercase letter.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       PASSWORD LOWERCASE
       ============================== */

    if(!/[a-z]/.test(password)){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Password must contain at least one lowercase letter.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       PASSWORD NUMBER
       ============================== */

    if(!/[0-9]/.test(password)){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Password must contain at least one number.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       PASSWORD SPECIAL CHARACTER
       ============================== */

    if(!/[!@#$%^&*(),.?":{}|<>_\-+=\/\\[\];'`~]/.test(password)){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Password must contain at least one special character.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       NO SPACES IN PASSWORD
       ============================== */

    if(/\s/.test(password)){

      event.preventDefault();

      passwordInput.setCustomValidity(
        'Password cannot contain spaces.'
      );

      passwordInput.reportValidity();

      return;

    }


    /* ==============================
       EVERYTHING IS VALID
       ============================== */

    nameInput.setCustomValidity('');

    emailInput.setCustomValidity('');

    passwordInput.setCustomValidity('');

    /*
       Form will now submit normally.

       POST /perform_registration

       Flask will receive:

       name
       email
       password
    */

  }
);


/* =========================================
   CLEAR VALIDATION ERRORS WHILE TYPING
   ========================================= */

nameInput.addEventListener(
  'input',
  function(){

    nameInput.setCustomValidity('');

  }
);


emailInput.addEventListener(
  'input',
  function(){

    emailInput.setCustomValidity('');

  }
);


passwordInput.addEventListener(
  'input',
  function(){

    passwordInput.setCustomValidity('');

  }
);

</script>

</body>
</html>
